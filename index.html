<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandana's Daily Log</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 35px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .date {
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .card-body p {
            margin: 12px 0;
            line-height: 1.5;
            color: #e2e8f0;
        }
        .progress-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 15px;
            margin-bottom: 6px;
        }
        .progress-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            height: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Chandana's Daily Log</h1>
            <p>Automated Developer Journal • Built from Android</p>
        </header>
        <div id="entries">
        
        <!-- NEW_ENTRY -->
        <div class="card">
            <div class="card-header">
                <span class="date">📅 October 14, 2026 • 06:53 PM</span>
                <span class="stars">⭐⭐</span>
            </div>
            <div class="card-body">
                <p><strong>🎯 Primary Focus:</strong> work</p>
                <p><strong>✅ Completed:</strong> this project</p>
                <p><strong>💡 Learned:</strong> nothing</p>
            </div>
            <div class="progress-label">Day Energy / Rating (40%)</div>
            <div class="progress-bg">
                <div class="progress-bar" style="width: 40%;"></div>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
